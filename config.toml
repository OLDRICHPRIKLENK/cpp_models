# 3D Paul Trap Field Solver Configuration

[solver]
method = "bem"          # 'fem' or 'bem'

[bem]
element_type = "triangle"
collocation_method = "centroid"
quadrature_order = 4

[geometry]
r0 = 0.005             # Inner cylinder radius (meters) = 5 mm
z0 = 0.005             # Endcap half-distance (meters) = 5 mm
electrode_gap = 0.0002 # Gap between segmented electrodes (meters) = 0.2 mm

[mesh]
mesh_file = "data/meshes/trap.msh"
cl_scale = 0.0006      # Mesh characteristic element size (meters)
cl_min = 0.0001
cl_max = 0.0010
mesh_order = 1      

[fem]
order = 1              # H1 Finite element polynomial degree
refine_steps = 0       # Uniform mesh refinements before solve
solver_type = "cg"     # Linear solver: conjugate gradient
max_iter = 3000        # Maximum CG iterations
rel_tol = 1.0e-12      # Relative solver tolerance
abs_tol = 1.0e-16      # Absolute solver tolerance

[voltages]
# 6-element control voltage vector applied to electrodes (Volts)
# v1: Radial 1 (+x quadrant)
# v2: Radial 2 (+y quadrant)
# v3: Radial 3 (-x quadrant)
# v4: Radial 4 (-y quadrant)
# v5: Endcap 1 (+z top cap)
# v6: Endcap 2 (-z bottom cap)
v1 = 100.0
v2 = -100.0
v3 = 100.0
v4 = -100.0
v5 = 50.0
v6 = 50.0

[interpolation]
polynomial_degree = 4  # Degree of multivariate polynomial fit (2 for quadrupole)
rbf_basis = "multiquadric"
rbf_smoothing = 1.0e-5

# Regular 3D Cartesian evaluation grid bounding box (meters)
grid_x_min = -0.002
grid_x_max = 0.002
grid_y_min = -0.002
grid_y_max = 0.002
grid_z_min = -0.002
grid_z_max = 0.002

# Evaluation grid resolution (number of sample points per axis)
grid_nx = 21
grid_ny = 21
grid_nz = 21

[output]
vtk_fem_file = "output/vtk/fem_solution.vtu"
vtk_bem_file = "output/vtk/bem_solution.vtu"
vtk_interpolated_file = "output/vtk/interpolated_grid.vtu"
vtk_analytical_file = "output/vtk/analytical_field.vtu"
vtk_residual_file = "output/vtk/residual_error.vtu"
report_polynomial_file = "output/reports/polynomial_equation.txt"
report_metrics_file = "output/reports/validation_metrics.txt"

